[font]
size = 10.5

[font.normal]
family = "GohuFont 14 Nerd Font"
style = "Regular"

[font.bold]
family = "GohuFont 14 Nerd Font"
style = "Regular"

[window]
padding = { x = 14, y = 14 }

[selection]
save_to_clipboard = true

# Everforest Dark Hard
[colors.primary]
background = "#272e33"
foreground = "#d3c6aa"

[colors.normal]
black   = "#414b50"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#d3c6aa"

[colors.bright]
black   = "#414b50"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#d3c6aa"

[colors.selection]
background = "#4c3743"
text       = "#d3c6aa"
